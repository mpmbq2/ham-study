[project]
name = "ham-study"
version = "0.1.0"
description = "Ham Radio General Class license study dashboard"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.28.0",
    "google-auth>=2.29.0",
    "google-cloud-storage>=2.16.0",
    "pandas>=2.2.0",
    "plotly>=5.20.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.58.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
